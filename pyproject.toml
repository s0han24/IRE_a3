[project]
name = "annbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "s0han24", email = "sohan.thummala@students.iiit.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = ["slow: takes more than ~1s; skipped by default"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
